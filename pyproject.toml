[project]
name = "guilliams-api"
version = "0.1.0"
description = "Phase 1 mobile API with local fixtures and SQLite persistence"
requires-python = ">=3.11"
dependencies = ["fastapi==0.143.3", "uvicorn==0.54.0", "pydantic==2.14.1"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
