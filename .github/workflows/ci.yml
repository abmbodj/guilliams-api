name: Verify API
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install -r requirements-dev.txt
      - run: ruff check app tests scripts
      - run: ruff format --check app tests scripts
      - run: pytest -q
      - run: python scripts/verify_contract.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exercise mobile fetch client against HTTP server
        run: |
          uvicorn app.main:app --host 127.0.0.1 --port 8765 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          python - <<'PYTHON'
          import time, urllib.request
          for attempt in range(50):
              try:
                  urllib.request.urlopen('http://127.0.0.1:8765/api/health/', timeout=1)
                  break
              except OSError:
                  time.sleep(.2)
          else:
              raise SystemExit('API did not start')
          PYTHON
          node examples/smoke.mjs
